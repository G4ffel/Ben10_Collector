{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Ben 10 Collector</title>
  <link rel="icon" type="image/png" href="/media/omnitrix/Ben_10_Omnitrix.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <style>
    body {
      background-color: #030712;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }
    .auth-card {
      background: rgba(10, 20, 15, 0.85);
      border: 1px solid var(--green-primary, #00ff66);
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.25), inset 0 0 15px rgba(0, 255, 102, 0.1);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(10px);
      z-index: 10;
      position: relative;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .auth-logo img {
      width: 70px;
      height: 70px;
      filter: drop-shadow(0 0 12px var(--green-primary, #00ff66));
    }
    .auth-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      text-align: center;
      color: #fff;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .auth-subtitle {
      text-align: center;
      color: #9ca3af;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: var(--green-primary, #00ff66);
      margin-bottom: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 255, 102, 0.3);
      border-radius: 8px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      outline: none;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
    .form-group input:focus {
      border-color: var(--green-primary, #00ff66);
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--green-primary, #00ff66), #00b347);
      color: #000;
      border: none;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.7);
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      color: #9ca3af;
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: var(--green-primary, #00ff66);
      text-decoration: none;
      font-weight: 600;
    }
    .alert-msg {
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 50, 50, 0.2);
      border: 1px solid #ff3333;
      color: #ff8888;
      font-size: 0.85rem;
      margin-bottom: 16px;
      text-align: center;
    }
    .helptext {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="global-bg">
    <div class="energy-ring ring-1"></div>
    <div class="energy-ring ring-2"></div>
    <div class="particles-container" id="global-particles"></div>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <img src="/media/omnitrix/Ben_10_Omnitrix.png" alt="Omnitrix">
    </div>
    <h2 class="auth-title">CREAR CUENTA</h2>
    <p class="auth-subtitle">Crea tu perfil de Coleccionista del Omnitrix</p>

    {% if messages %}
      {% for message in messages %}
        <div class="alert-msg">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'registro' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">Usuario</label>
        <input type="text" id="id_username" name="username" placeholder="Tu nombre de usuario" required autofocus>
      </div>

      <div class="form-group">
        <label for="id_password1">Contraseña</label>
        <input type="password" id="id_password1" name="password1" placeholder="••••••••" required>
        <span class="helptext">Mínimo 8 caracteres.</span>
      </div>

      <div class="form-group">
        <label for="id_password2">Confirmar Contraseña</label>
        <input type="password" id="id_password2" name="password2" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">ACTIVAR PERFIL</button>
    </form>

    <div class="auth-footer">
      ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
    </div>
  </div>
</body>
</html>
